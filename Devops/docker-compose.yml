services:
  mysqldbs:
    image: mysql:8
    container_name: mysqldbs
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    deploy:
      resources:
        limits:
          memory: "512Mi"
          cpus: "0.5"
    networks:
      - devopsnet

  springboot-backend:
    build:
      context: ./springboot-backend
    container_name: springboot-backend
    restart: unless-stopped
    # Port 8020 is only needed internally via nginx; do not expose to the host
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldbs:3306/${MYSQL_DATABASE}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - ML_SERVICE_URL=http://ml-service:8000/analyze
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5-coder:14b
      - JENKINS_URL=http://host.docker.internal:8080
      - JENKINS_USER=${JENKINS_USER}
      - JENKINS_TOKEN=${JENKINS_TOKEN}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8020/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    depends_on:
      mysqldbs:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: "1Gi"
          cpus: "1.0"
    networks:
      - devopsnet

  ml-service:
    build:
      context: ./ml-service
    container_name: ml-service
    restart: unless-stopped
    # Port 8000 is only needed internally; do not expose to the host
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ml-data:/data
    deploy:
      resources:
        limits:
          memory: "512Mi"
          cpus: "0.5"
    networks:
      - devopsnet

  react-frontend:
    build:
      context: ./react-frontend
    container_name: react-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: "256Mi"
          cpus: "0.25"
    networks:
      - devopsnet

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      react-frontend:
        condition: service_healthy
      springboot-backend:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: "128Mi"
          cpus: "0.25"
    networks:
      - devopsnet

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    # No host port — Grafana queries Prometheus internally; expose 9090 locally if needed for debugging
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml
      - ./recording.rules.yml:/etc/prometheus/recording.rules.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      springboot-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: "512Mi"
          cpus: "0.5"
    networks:
      - devopsnet

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: "512Mi"
          cpus: "0.5"
    networks:
      - devopsnet

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    # No host port — Prometheus routes alerts to alertmanager internally
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--config.expand-env=true'
    deploy:
      resources:
        limits:
          memory: "128Mi"
          cpus: "0.25"
    networks:
      - devopsnet

volumes:
  grafana-data:
  ml-data:

networks:
  devopsnet:
    driver: bridge
