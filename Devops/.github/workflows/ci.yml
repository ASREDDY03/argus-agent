name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch so each push doesn't pile up
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Secret scanning (runs first — blocks everything else if a secret leaks) ──
  secret-scan:
    name: Secret scan — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits in the PR

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Spring Boot ──────────────────────────────────────────────────────────────
  springboot:
    name: Spring Boot — build & test
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: Devops/springboot-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: springboot-surefire-reports
          path: Devops/springboot-backend/target/surefire-reports/*.xml
          if-no-files-found: ignore

  # ── React frontend ───────────────────────────────────────────────────────────
  react:
    name: React — lint & test
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: Devops/react-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: Devops/react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint & test
        run: CI=true npm test -- --watchAll=false

      - name: Build
        run: npm run build

  # ── ML service ───────────────────────────────────────────────────────────────
  ml-service:
    name: ML service — tests
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: Devops/ml-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  # ── Trivy image scans (parallel, one job per service) ────────────────────────
  # Each job builds its image with `load: true` so the image lands in the local
  # Docker daemon where Trivy can inspect it. exit-code: 0 means the scan reports
  # findings but never fails the build — set to 1 to enforce a hard gate.
  # SARIF output is uploaded to the GitHub Security tab for triage.

  trivy-springboot:
    name: Trivy — springboot-backend
    runs-on: ubuntu-latest
    needs: [springboot, react, ml-service]
    permissions:
      security-events: write   # required to upload SARIF

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: Devops/springboot-backend
          load: true            # loads into local daemon so Trivy can scan it
          tags: springboot-backend:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: springboot-backend:${{ github.run_number }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Scan with Trivy (SARIF → Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: springboot-backend:${{ github.run_number }}
          format: sarif
          output: trivy-springboot.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-springboot.sarif
          category: trivy-springboot-backend

  trivy-react:
    name: Trivy — react-frontend
    runs-on: ubuntu-latest
    needs: [springboot, react, ml-service]
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: Devops/react-frontend
          load: true
          tags: react-frontend:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: react-frontend:${{ github.run_number }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Scan with Trivy (SARIF → Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: react-frontend:${{ github.run_number }}
          format: sarif
          output: trivy-react.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-react.sarif
          category: trivy-react-frontend

  trivy-ml:
    name: Trivy — ml-service
    runs-on: ubuntu-latest
    needs: [springboot, react, ml-service]
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: Devops/ml-service
          load: true
          tags: ml-service:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ml-service:${{ github.run_number }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Scan with Trivy (SARIF → Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ml-service:${{ github.run_number }}
          format: sarif
          output: trivy-ml.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-ml.sarif
          category: trivy-ml-service
