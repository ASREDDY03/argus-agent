name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch so each push doesn't pile up
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Secret scanning (runs first — blocks everything else if a secret leaks) ──
  secret-scan:
    name: Secret scan — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits in the PR

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Spring Boot ──────────────────────────────────────────────────────────────
  springboot:
    name: Spring Boot — build & test
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: Devops/springboot-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: springboot-surefire-reports
          path: Devops/springboot-backend/target/surefire-reports/*.xml
          if-no-files-found: ignore

  # ── React frontend ───────────────────────────────────────────────────────────
  react:
    name: React — lint & test
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: Devops/react-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: Devops/react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint & test
        run: CI=true npm test -- --watchAll=false --passWithNoTests

      - name: Build
        run: npm run build

  # ── ML service ───────────────────────────────────────────────────────────────
  ml-service:
    name: ML service — tests
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: Devops/ml-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  # ── Docker build check (no push) ─────────────────────────────────────────────
  docker-build:
    name: Docker — build all images
    runs-on: ubuntu-latest
    needs: [springboot, react, ml-service]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build springboot-backend
        uses: docker/build-push-action@v5
        with:
          context: Devops/springboot-backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build react-frontend
        uses: docker/build-push-action@v5
        with:
          context: Devops/react-frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ml-service
        uses: docker/build-push-action@v5
        with:
          context: Devops/ml-service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
