#Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/argus_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:argus_user}
spring.datasource.password=${DB_PASSWORD:}
server.port=8020
logging.level.org.hibernate.SQL=DEBUG

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)o
spring.jpa.hibernate.ddl-auto= create-drop

# Jenkins integration - Prefer env vars, avoid hardcoded secrets
jenkins.url=${JENKINS_URL:http://jenkins:8080}
jenkins.job=${JENKINS_JOB:frontend-deploy}
jenkins.user=${JENKINS_USER:admin}
jenkins.token=${JENKINS_TOKEN:}

# Python ML microservice endpoint
ml.service.url=http://localhost:8000/analyze

# Slack alerts (leave blank to disable)
slack.webhook.url=${SLACK_WEBHOOK_URL:}

# Claude AI (leave blank to fall back to Ollama)
anthropic.api.key=${ANTHROPIC_API_KEY:}

# Ollama fallback
ollama.url=${OLLAMA_URL:http://host.docker.internal:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5-coder:14b}

# Prometheus and Actuator
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
