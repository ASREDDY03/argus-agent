apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
data:
  # Base64-encode your password before committing: echo -n "yourpassword" | base64
  # Do NOT commit the actual encoded value to source control.
  # Create the secret manually: kubectl create secret generic mysql-secret --from-literal=root-password=yourpassword
  root-password: REPLACE_WITH_BASE64_ENCODED_PASSWORD
