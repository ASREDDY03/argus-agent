apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-data-pvc
  namespace: staging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service-deploy
  namespace: staging
  labels:
    app: ml-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ml-service
          image: lugar2020/ml-service:docker_tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ML_DATA_DIR
              value: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: ml-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: ml-data
          persistentVolumeClaim:
            claimName: ml-data-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: staging
  labels:
    name: ml-service
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: ml-service
