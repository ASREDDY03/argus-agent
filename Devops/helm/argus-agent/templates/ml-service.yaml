apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-data-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mlService.persistence.size }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service-deploy
  namespace: {{ .Release.Namespace }}
  labels:
    app: ml-service
    {{- include "argus-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mlService.replicas }}
  selector:
    matchLabels:
      app: ml-service
      {{- include "argus-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: ml-service
        {{- include "argus-agent.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ml-service
          image: "{{ .Values.images.mlService.repository }}:{{ .Values.images.mlService.tag }}"
          imagePullPolicy: {{ .Values.images.mlService.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: ML_DATA_DIR
              value: /data
          resources:
            {{- toYaml .Values.mlService.resources | nindent 12 }}
          volumeMounts:
            - name: ml-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: ml-data
          persistentVolumeClaim:
            claimName: ml-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: ml-service
    {{- include "argus-agent.selectorLabels" . | nindent 4 }}
