apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ required "mysql.rootPassword is required — pass via --set mysql.rootPassword=..." .Values.mysql.rootPassword | quote }}

---
{{- if .Values.mysql.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mysql.persistence.size }}

---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deploy
  namespace: {{ .Release.Namespace }}
  labels:
    app: mysqldb
    {{- include "argus-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysqldb
      {{- include "argus-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: mysqldb
        {{- include "argus-agent.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: mysqldb
          image: mysql:8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          {{- if .Values.mysql.persistence.enabled }}
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          {{- end }}
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
      {{- if .Values.mysql.persistence.enabled }}
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data-pvc
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: mysqldb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: mysqldb
    {{- include "argus-agent.selectorLabels" . | nindent 4 }}
